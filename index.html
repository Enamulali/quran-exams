<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qur'an exams">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Qur'an exams</title>

<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Apple system font, iOS controls and Apple system colours. */
  :root {
    /* Apple system colours: blue tint, green for done, red for mistakes */
    --tint: #007aff; --tint-soft: #e5f1ff; --green: #248a3d; --green-soft: #e8f6ec; --label: #1c1c1e; --second: #6c6c70; --third: #a1a1a6;
    --fill: #f2f2f7; --fill2: #e9e9ee; --sep: #e3e3e8; --red: #ff3b30; --red-ink: #d70015; --red-soft: #ffeceb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #fff; color: var(--label);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0;
    transition: transform 100ms ease-out, background-color 100ms ease-out; }
  button:not([disabled]):active { transform: scale(0.97); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  input, textarea { font: inherit; color: inherit; }
  input:focus, textarea:focus { outline: none; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px 140px; position: relative; }

  .top { max-width: 900px; margin: 0 auto; padding: 18px 24px 0; display: flex; align-items: center; gap: 16px; font-size: 17px; }
  .top .back { color: var(--tint); padding: 8px 0; text-align: left; }
  .top .back b { font-weight: 400; }
  .top .right { margin-left: auto; display: flex; gap: 12px; align-items: center; white-space: nowrap; font-size: 15px; }
  .top .exm { color: var(--second); padding: 8px 0; }
  .top .exm b { color: var(--label); font-weight: 400; }
  .top .exm.unset { color: var(--tint); }
  .savestate { color: var(--third); }
  .savestate.err { color: var(--red); }

  h1.page { font-weight: 700; font-size: 34px; line-height: 1.15; letter-spacing: .01em; margin: 10px 0 2px; }
  .meta { color: var(--second); font-size: 15px; margin-bottom: 14px; }

  /* iOS segmented control */
  .tabs, .exam { display: inline-flex; background: var(--fill2); border-radius: 9px; padding: 2px; margin: 8px 0 0; }
  .tabs button, .exam button { padding: 6px 22px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--label); }
  .tabs button.on, .exam button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
  .tabs button:active, .exam button:active { transform: none; }

  .search { display: flex; align-items: center; height: 40px; background: var(--fill2); border-radius: 10px; padding: 0 10px; margin: 16px 0 4px; }
  .search svg { flex: none; margin-right: 6px; }
  .search input { flex: 1; min-width: 0; border: 0; font-size: 17px; background: transparent; }
  .search input::placeholder { color: var(--second); }
  .search .clr { color: var(--second); font-size: 20px; padding: 4px 6px; }
  .hint { color: var(--second); font-size: 13px; margin: 8px 0 0; }

  /* iOS list rows */
  .rows { margin-top: 12px; border-top: .5px solid var(--sep); }
  .rows.two { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; border-bottom: .5px solid var(--sep);
    text-align: left; font-size: 17px; padding: 8px 2px; }
  .row::after { content: "\203A"; color: var(--third); font-size: 22px; margin-left: 4px; }
  .row[disabled]::after { content: none; }
  .row:active { transform: none; background: var(--fill); }
  .row .nm { min-width: 0; }
  .row .ctx { font-size: 15px; color: var(--second); }
  .row .st { margin-left: auto; font-size: 15px; color: var(--third); white-space: nowrap; }
  .row .st.dn { color: var(--green); }
  .row .st.ip { color: var(--second); }
  .row[disabled] { color: var(--third); cursor: default; }
  .row mark { background: none; color: var(--label); font-weight: 600; }
  .addp { margin-top: 16px; color: var(--tint); font-size: 17px; padding: 8px 0; }
  .empty { color: var(--second); padding: 24px 0; }

  /* marking */
  .who { text-align: center; margin-top: 2px; }
  .who h1 { font-weight: 700; font-size: 34px; line-height: 1.15; margin: 0; }
  .who .ar { font: 400 26px/1.4 "SF Arabic", "Geeza Pro", -apple-system, system-ui, sans-serif; color: var(--label); min-height: 40px; }
  .who .ar:empty { min-height: 8px; }
  .exam { display: flex; width: 300px; margin: 6px auto 0; }
  .exam button { flex: 1; padding: 6px 0; }
  .steps { display: flex; background: var(--fill2); border-radius: 9px; padding: 2px; margin: 14px 0 0; }
  .steps button { flex: 1; padding: 8px 6px; border-radius: 7px; font-size: 15px; color: var(--label); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .steps button.on { background: #fff; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
  .steps button.ok { color: var(--second); }
  .steps button .sc { color: var(--green); margin-left: 6px; font-weight: 600; }
  .steps button:active { transform: none; }

  .step { display: none; padding-top: 20px; }
  .step.cur, .step.peek { display: block; }
  .flat { padding-top: 20px; }
  .pick { display: flex; align-items: center; height: 48px; background: var(--fill); border-radius: 10px; padding: 0 14px; margin-bottom: 22px; }
  .pick label { color: var(--second); width: 70px; flex: none; }
  .pick input { flex: 1; min-width: 0; border: 0; font-size: 17px; font-weight: 600; background: transparent; }
  .pick input::placeholder { font-weight: 400; color: var(--third); }
  .lab .opt { text-transform: none; letter-spacing: 0; }
  .lab { font-size: 13px; font-weight: 400; color: var(--second); text-transform: uppercase; letter-spacing: .04em;
    margin: 0 0 8px 2px; display: flex; align-items: baseline; }
  .lab .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 15px; }
  .lab .aside button { color: var(--tint); }
  .marks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 22px; }
  .zero { margin: -12px 0 20px; }
  .zero[hidden] { display: none; }
  .zero button { font-size: 15px; color: var(--red-ink); background: var(--red-soft); border-radius: 10px; padding: 9px 16px; }
  .zero button.on { background: var(--red); color: #fff; }
  .marks button { height: 60px; background: var(--fill); border-radius: 12px; font-size: 22px; font-weight: 500; }
  .marks button:active { transform: scale(0.95); background: var(--fill2); }
  .marks button.on { background: var(--tint); color: #fff; }

  .mrow { display: flex; background: var(--fill); border-radius: 12px; overflow: hidden; }
  .mrow .ay { width: 96px; flex: none; border: 0; border-right: .5px solid var(--sep); padding: 0 10px; font-size: 16px;
    text-align: center; background: transparent; }
  .mrow .ay::placeholder { color: var(--third); }
  .quick { display: flex; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex: 1 1 auto; padding: 14px 5px; font-size: 13.5px; color: var(--label); border-left: .5px solid var(--sep); white-space: nowrap; }
  .quick button:first-child { border-left: 0; }
  .quick button:active { transform: none; background: var(--red-soft); color: var(--red-ink); }
  .mlist { list-style: none; margin: 12px 0 0 2px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 22px; }
  .mlist li { color: var(--red-ink); font-size: 15px; display: flex; align-items: center; }
  .mlist li button { color: var(--third); font-size: 18px; padding: 2px 8px; }

  textarea { width: 100%; min-height: 96px; border: 0; background: var(--fill); border-radius: 12px; padding: 12px 14px; }
  .cmt { margin-top: 24px; }

  .letters { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; direction: rtl; }
  .letters button { height: 72px; background: var(--fill); border-radius: 12px; position: relative; font: 400 38px/1 "Scheherazade New", serif; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); column-gap: 32px; border-top: .5px solid var(--sep); margin-bottom: 10px; }
  .items button { display: flex; align-items: center; min-height: 50px; border-bottom: .5px solid var(--sep); text-align: left; font-size: 16px; }
  .items button:active { transform: none; background: var(--fill); }
  .items button .tick { margin-left: auto; }
  .yes { color: var(--green) !important; background: var(--green-soft) !important; }
  .no { color: var(--red-ink) !important; background: var(--red-soft) !important; }
  .items .yes, .items .no { background: none !important; }
  .tick { font-size: 15px; font-weight: 600; }
  .letters .tick { position: absolute; top: 6px; left: 9px; font-family: -apple-system, system-ui, sans-serif; }
  .smallbtn { color: var(--tint); font-size: 15px; padding: 8px 2px; }
  .block { margin-bottom: 26px; }

  /* bottom bar: translucent material, always within reach */
  .dock { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 30;
    max-width: 876px; margin: 0 auto; background: rgba(255,255,255,.78);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border: .5px solid rgba(0,0,0,.08); border-radius: 22px; box-shadow: 0 6px 24px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
    padding: 10px 10px 10px 20px !important; }
  .dock .main { border-radius: 14px; }
  .dock .in { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 20px; }
  .dock .tot { font-size: 30px; font-weight: 700; white-space: nowrap; }
  .dock .tot small { font-size: 15px; font-weight: 400; color: var(--second); margin-left: 4px; }
  .dock .miss { font-size: 14px; color: var(--second); flex: 1; min-width: 0; }
  .dock .prev { color: var(--tint); font-size: 17px; padding: 12px 6px; white-space: nowrap; }
  .dock .main { background: var(--tint); color: #fff; border-radius: 12px; padding: 14px 26px; font-weight: 600; font-size: 17px; white-space: nowrap; }
  .dock .main.done { background: var(--fill2); color: var(--tint); }

  .toast { position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%); z-index: 50; background: rgba(28,28,30,.9);
    color: #fff; padding: 12px 18px; border-radius: 12px; max-width: 90vw; display: none; font-size: 15px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 60; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal .box { background: #fff; border-radius: 14px; padding: 22px; width: 100%; max-width: 460px; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
  .modal h3 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
  .modal input { width: 100%; height: 46px; border: 0; background: var(--fill); border-radius: 10px; padding: 0 14px; margin: 10px 0; }
  .modal .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
  .modal .acts button { padding: 11px 18px; border-radius: 10px; color: var(--tint); font-weight: 500; }
  .modal .acts .pri { background: var(--tint); color: #fff; }
  .guide { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; color: var(--second); }
  .guide b { color: var(--label); font-weight: 600; }

  table.prog { width: 100%; border-collapse: collapse; margin-bottom: 24px; font-size: 15px; }
  table.prog th, table.prog td { padding: 11px 8px 11px 0; border-bottom: .5px solid var(--sep); text-align: left; }
  table.prog th { font-size: 13px; color: var(--second); font-weight: 400; text-transform: uppercase; letter-spacing: .04em; }
  table.prog td.n { text-align: right; }
  h2.sec { font-size: 22px; font-weight: 700; margin: 26px 0 6px; }
  a.link { color: var(--tint); }

  @media (max-width: 700px) {  /* small tablets / phones in landscape */
    .rows.two { grid-template-columns: 1fr; }
    .letters { grid-template-columns: repeat(4, 1fr); }
    .dock .miss { display: none; }
    .steps button { font-size: 13px; }
  }

  /* platform baseline (mobile-native): no tap flash, no font inflation, no page bounce, 16px inputs, instant taps */
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  input, textarea { font-size: 16px; }
  button { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .top { padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .wrap { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .quick { overscroll-behavior-x: contain; }
  /* where the mistake buttons run past the edge, fade it so it reads as "swipe for more" */
  @media (max-width: 1000px) {
    .quick { -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); }
  }

  /* laptop: short screens - keep the whole marking page above the bottom bar without scrolling */
  @media (min-width: 701px) and (max-height: 820px) {
    .top { padding-top: 12px; }
    .who h1 { font-size: 28px; }
    .who .ar { font-size: 24px; min-height: 34px; }
    .exam { margin-top: 2px; }
    .steps { margin-top: 10px; }
    .step, .flat { padding-top: 14px; }
    .pick { height: 44px; margin-bottom: 14px; }
    .marks { margin-bottom: 14px; }
    .marks button { height: 50px; font-size: 20px; }
    .mlist { margin-top: 8px; }
    .letters button { height: 58px; font-size: 32px; }
    .dock { padding-top: 10px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
    .dock .tot { font-size: 26px; }
    .dock .main { padding: 12px 22px; }
    .wrap { padding-bottom: 110px; }
    h1.page { font-size: 30px; }
  }

  /* phone */
  @media (max-width: 600px) {
    .top { font-size: 15px; gap: 10px; }
    .top .back { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top .right { font-size: 13px; }
    .top .exm b { display: inline-block; max-width: 120px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
    .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 120px; }
    h1.page, .who h1 { font-size: 28px; }
    .who .ar { font-size: 24px; min-height: 34px; }
    .exam { width: 100%; }
    .steps button { font-size: 14px; padding: 8px 2px; }
    .steps .sn { display: none; }
    .steps button .sc { margin-left: 4px; }
    .marks { gap: 6px; }
    .marks button { height: 52px; font-size: 20px; }
    .mrow .ay { width: 96px; font-size: 16px; padding: 0 6px; }
    .quick button { flex: 0 0 auto; padding: 14px 12px; }
    .row { font-size: 16px; flex-wrap: wrap; row-gap: 2px; }
    .row .ctx { flex-basis: 100%; order: 3; font-size: 13px; }
    .letters { grid-template-columns: repeat(4, 1fr); }
    .letters button { height: 60px; font-size: 32px; }
    .dock { padding-left: 16px; padding-right: 16px; }
    .dock .in { gap: 10px; }
    .dock .tot { font-size: 24px; }
    .dock .tot small { font-size: 13px; }
    .dock .miss { display: none; }
    .dock .prev { margin-left: auto; padding: 12px 10px; font-size: 20px; }
    .dock .prev .pw { display: none; }
    .dock .main { padding: 13px 16px; font-size: 16px; }
    .dock .prev[style*="none"] + .main { margin-left: auto; }
    .modal .box { padding: 18px; }
  }
  /* boxes: sides and classes big, pupils small; a green line along the bottom = how much is done */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 16px; }
  .tiles.big { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .tiles.small { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .tile { position: relative; overflow: hidden; background: var(--fill); border-radius: 14px; text-align: left;
    padding: 18px 18px 22px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
  .tiles.big .tile { min-height: 150px; padding: 22px; }
  .tiles.small .tile { min-height: 76px; padding: 14px 14px 16px; border-radius: 12px; gap: 4px; }
  .tile:active { transform: scale(0.98); background: var(--fill2); }
  .tile .nm { font-size: 20px; font-weight: 600; line-height: 1.2; }
  .tiles.big .tile .nm { font-size: 24px; }
  .tiles.small .tile .nm { font-size: 16px; }
  .tile .st { font-size: 14px; color: var(--second); }
  .tile .st.dn { color: var(--green); }
  .tile .trk { position: relative; display: block; height: 4px; border-radius: 2px; background: #dcdce1; overflow: hidden; margin-top: 4px; }
  .tile .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); border-radius: 2px; }
  .tile .bar.ip { background: #a1d6ae; }
  .tile[disabled] { color: var(--third); }
  /* surah suggestions under the box */
  .pick-hint { font-size: 13px; color: var(--second); margin: -16px 0 18px 4px; }
  .pick-hint.warn { color: #c93400; font-weight: 500; }
  .pick-hint [lang="ar"] { font: 400 17px/1 "SF Arabic", "Geeza Pro", -apple-system, system-ui, sans-serif; color: var(--label); }
  .picker { position: relative; }
  .pick .caret { width: 9px; height: 9px; border-right: 2px solid var(--third); border-bottom: 2px solid var(--third); transform: rotate(45deg) translateY(-3px); flex: none; margin-left: 8px; }
  .sugg { position: absolute; left: 0; right: 0; top: 52px; z-index: 40; background: #fff; border-radius: 12px; max-height: min(360px, 52vh); overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.08); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sugg[hidden] { display: none; }
  .sugg .grp { font-size: 12px; color: var(--second); text-transform: uppercase; letter-spacing: .04em; padding: 10px 14px 4px; position: sticky; top: 0; background: #fff; }
  .sugg button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 8px 14px; text-align: left; font-size: 16px; border-top: .5px solid var(--sep); }
  .sugg .grp + button { border-top: 0; }
  .sugg button:active, .sugg button.hi { background: var(--fill); }
  .sugg .sno { width: 28px; color: var(--third); font-variant-numeric: tabular-nums; flex: none; }
  .sugg .en { flex: 1; min-width: 0; }
  .sugg .now { font-size: 13px; color: var(--tint); margin-left: 6px; }
  .sugg .sar { font: 400 18px/1 "SF Arabic", "Geeza Pro", -apple-system, system-ui, sans-serif; color: var(--second); }
  .sugg .none { padding: 14px; color: var(--second); }
  /* Read Book "any pages" rows */
  .tabs.pm { margin: 0; }
  .pages { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; border-top: .5px solid var(--sep); margin-bottom: 8px; }
  @media (max-width: 600px) { .pages { grid-template-columns: 1fr; } }
  .pg { display: flex; align-items: center; gap: 10px; min-height: 60px; border-bottom: .5px solid var(--sep); }
  .pg label { color: var(--second); width: 44px; }
  .pg select { height: 44px; min-width: 84px; font: inherit; font-size: 17px; border: 0; background: var(--fill);
    border-radius: 10px; padding: 0 12px; color: var(--label); }
  .pg button[data-pv] { width: 60px; height: 44px; border-radius: 10px; background: var(--fill); font-size: 20px; font-weight: 600; color: var(--third); }
  .pg .rm { margin-left: auto; color: var(--third); font-size: 24px; padding: 6px 10px; }
  /* Salafi School logo at the foot of Saturday School pages (kept clear of the bottom bar) */
  body.has-logo .wrap { padding-bottom: 8px; }
  .brand { text-align: center; padding: 28px 16px 40px; }
  .brand img { height: 34px; width: auto; opacity: .9; }
  body.marking .brand { padding-bottom: 130px; }

  /* phone, marking: everything for one surah fits above the bottom bar - no scrolling */
  @media (max-width: 600px) {
    body.marking .brand { display: none; }
    body.marking .wrap { padding-bottom: 96px; }
    body.marking .top { padding-top: calc(env(safe-area-inset-top, 0px) + 8px); }
    body.marking .top .back { padding: 4px 0; }
    body.marking .who h1 { font-size: 22px; }
    body.marking .who .ar { font-size: 20px; min-height: 26px; line-height: 1.3; }
    body.marking .who .ar:empty { min-height: 0; }
    body.marking .exam { margin-top: 6px; }
    body.marking .exam button { padding: 5px 0; }
    body.marking .steps { margin-top: 8px; }
    body.marking .steps button { padding: 6px 2px; }
    body.marking .steps button { flex: 1 1 auto; min-width: 0; padding: 6px 6px; }   /* long surah names get the room */
    body.marking .step, body.marking .flat { padding-top: 12px; }
    body.marking .pick { height: 42px; margin-bottom: 14px; }
    body.marking .pick-hint { margin: -10px 0 10px 4px; font-size: 12px; }
    body.marking .lab { margin-bottom: 6px; font-size: 12px; }
    body.marking .marks { gap: 6px; margin-bottom: 12px; }
    body.marking .zero { margin: -6px 0 10px; }
    body.marking .zero button { padding: 7px 14px; font-size: 14px; }
    body.marking .marks button { height: 44px; font-size: 19px; border-radius: 10px; }
    /* fill the screen: the page is at least the phone's height; the keys grow (44px up to 66px a row) and
       whatever is left goes into the gaps above each section, so labels stay with their keys */
    body.marking { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
    body.marking #view { flex: 1 0 auto; display: flex; flex-direction: column; width: 100%; }
    body.marking #view > .step.cur, body.marking #view > .step.peek { flex: 1 0 auto; display: flex; flex-direction: column; }
    body.marking .step.cur > .marks, body.marking .step.peek > .marks { flex: 1 1 0; min-height: 93px; max-height: 137px; grid-template-rows: repeat(2, minmax(44px, 1fr)); }
    body.marking .step.cur > .marks button, body.marking .step.peek > .marks button { height: auto; min-height: 44px; font-size: 21px; }
    body.marking .step.cur > .lab, body.marking .step.peek > .lab { margin-top: auto; padding-top: 2px; }
    body.marking .step.cur > .lab:first-child, body.marking .step.peek > .lab:first-child { margin-top: 0; padding-top: 0; }
    body.marking .step.cur > .mrow, body.marking .step.peek > .mrow { flex: none; }
    body.marking .step.cur > .mrow .quick button, body.marking .step.cur > .mrow .ay,
    body.marking .step.peek > .mrow .quick button, body.marking .step.peek > .mrow .ay { min-height: 44px; }
    body.marking .quick button { padding: 11px 12px; }
    body.marking .mlist { margin-top: 8px; }
    body.marking .dock { padding: 8px 8px 8px 16px !important; }
    body.marking .dock .tot { font-size: 22px; }
    body.marking .dock .main { padding: 11px 16px; }
  }
  /* classes: two boxes per row */
  .tiles.two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 600px) { .tiles.two { grid-template-columns: 1fr; } }
  /* office (admin) links: iOS grouped background, tables as white cards */
  body.office, body.office .dock { background: #f2f2f7; }
  body.office table.prog { background: #fff; border-radius: 12px; overflow: hidden; }
  body.office table.prog th, body.office table.prog td { padding-left: 14px; }
  body.office table.prog th:last-child, body.office table.prog td:last-child { padding-right: 14px; }
  body.office .smallbtn { background: #fff; border-radius: 10px; padding: 10px 16px; margin-right: 8px; }
  .meta .who-for { color: var(--tint); font-weight: 500; }
  /* each school link shows its own colour at a glance: a band across the top and the page title */
  body.school { border-top: 5px solid var(--tint); }
  body.school h1.page { color: var(--tint); }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } button:active { transform: none; } }
</style>
</head>

  /* ---------------- class list ---------------- */
  function backToClasses() {

  function showClass() {
    setHeader('<b>' + esc(showName(S.school)) + '</b> &middot; ' + esc(S.side), backToClasses);

        total: p.total, max: p.max || (p.book === 'R50' ? 50 : 70) }; })
        .sort(function (a, b) { return a.pupil.localeCompare(b.pupil); });
      S.list.forEach(function (p) { var b = S.lastBook[rkey(S.school, S.side, S.cls, p.pupil)]; if (b) p.book = b; });
      renderClass();
    } else loading();
    var t = S.nav, school = S.school, side = S.side, cls = S.cls, sentAt = Date.now();
    call('getClassBundle', school, side, cls).then(function (r) {
      r.pupils.forEach(function (p) {
        var k = rkey(school, side, cls, p.pupil), got = r.recs[p.pupil.toLowerCase()] || {}, mine = S.recCache[k] || {};
        var merged = {}, ours = null;

        });
        if (merged.Q70 || merged.R50) S.recCache[k] = merged;

        }
      });

      if (r.suggest) S.suggest[rkey(school, side, cls, '')] = r.suggest;
      S.bundleReady[rkey(school, side, cls, '')] = true;
      // A save still on its way may not show in the list yet - keep the book just marked.
      r.pupils.forEach(function (p) { var b = S.lastBook[rkey(school, side, cls, p.pupil)]; if (b) p.book = b; });
      if (S.nav !== t) return;

    }).catch(function (e) { if (!held.length && S.nav === t) fail(e); });
  }

  function chip(p) {

    var html = '<h1 class="page">' + esc(clsName(S.cls)) + '</h1><div class="meta">' + S.list.length + ' pupils &middot; ' + done + ' done</div>' +

  /* ---------------- marking ---------------- */
  function blank(exam) {

              examiner: examiner(), status: 'Not started', comments: '' };
    if (exam === 'Q70') r.q = { tests: [0, 1, 2].map(function () { return { surah: '', taj: null, hif: null, mistakes: [] }; }),
                                flu: null, fluMistakes: [] };
    else r.r = { mode: 'any', letters: {}, items: {}, pages: [], mistakes: [] };   // Any pages is the default
    return r;
  }
  function lkey(exam) { return 'oe:rec:' + [S.home.round, S.school, S.side, S.cls, S.pupil, exam].join('|').toLowerCase(); }

  function openPupil(name, year, book) {
    flushSave();
    S.pupil = name; S.year = year || ''; S.recs = {};
    setHeader('<b>' + esc(clsName(S.cls)) + '</b> &middot; ' + esc(S.side), function () { flushSave(); showClass(); });
    var cached = S.recCache[rkey(S.school, S.side, S.cls, name)];
    var status = ((S.list || []).filter(function (p) { return p.pupil === name; })[0] || {}).status;
    var fresh = S.bundleReady[rkey(S.school, S.side, S.cls, '')];      // the class's records have arrived
    // One iPad per class in practice, so a child not yet started opens at once.
    var instant = !!(cached || status === 'Not started');
    var fetch = instant ? Promise.resolve(cached || {}) :
      (loading('Opening ' + name + '...'), call('getRecord', S.school, S.side, S.cls, name));
    S.touchedEx = {};
    fetch.then(function (got) {
      ['Q70', 'R50'].forEach(function (ex) {
        var server = got[ex];
        var local = null; try { local = JSON.parse(store(lkey(ex)) || 'null'); } catch (e) {}
        // An unsent local copy (iPad locked mid-save) wins over an older server copy.
        if (local && local.dirty && (!server || (local.rec.updated || 0) >= (server.updated || 0))) {
          S.recs[ex] = local.rec; queueSave(ex);
        } else if (server) S.recs[ex] = server;
        else if (instant && !cached && local && local.rec) S.recs[ex] = local.rec;   // saved earlier on this iPad
      });
      S.base = { Q70: S.recs.Q70 ? S.recs.Q70.updated || 0 : 0, R50: S.recs.R50 ? S.recs.R50.updated || 0 : 0 };
      if (instant) checkOpen(name);
      // Open on the pupil's book: last marked, else the Pupils tab's Book, else the class default.
      if (book === 'Q70' || book === 'R50') S.exam = book;
      else if (S.recs.Q70 && S.recs.R50) S.exam = (S.recs.R50.updated || 0) > (S.recs.Q70.updated || 0) ? 'R50' : 'Q70';
      else S.exam = S.recs.R50 ? 'R50' : (S.recs.Q70 ? 'Q70' : guessExam());
      if (!S.recs[S.exam]) S.recs[S.exam] = blank(S.exam);
      renderMark();
    }).catch(fail);
  }

  /* Opened before the class's records arrived: ask the server for this child. If it holds marks this
     iPad did not know about, show them (or, if the teacher has already started, ask which to keep). */
  function checkOpen(name) {
    var at = { school: S.school, side: S.side, cls: S.cls, pupil: name };
    // Hold this child's saves until the server answers, so a quick first mark cannot overwrite marks
    // this iPad has not seen yet. Let go after 15 s whatever happens (no signal: saves queue as normal).
    var pk = rkey(at.school, at.side, at.cls, name), rel = function () { if (S.hold[pk] === tok) delete S.hold[pk]; };
    var tok = {}; S.hold[pk] = tok; setTimeout(rel, 15000);
    call('getRecord', at.school, at.side, at.cls, name).then(function (got) {
      if (S.pupil !== name || S.cls !== at.cls || S.side !== at.side || !$('dock') || $('dock').style.display === 'none') return rel();
      var base = S.base || {}, edited = S.touchedEx || {};
      // Server has something newer than the copy this sheet was opened from (or no longer has that copy).
      var diff = ['Q70', 'R50'].filter(function (ex) {
        var a = got[ex];
        if (!a) return base[ex] > 0 && !edited[ex];
        return (a.updated || 0) > (base[ex] || 0) && !S.mine[a.updated];     // not a copy this iPad sent
      });
      if (!diff.length) return rel();
      var take = function (list) {
        list.forEach(function (ex) {
          base[ex] = got[ex] ? (got[ex].updated || 0) : 0; edited[ex] = false;
          if (got[ex]) { S.recs[ex] = got[ex]; var sc = score(got[ex]);
            noteSaved(JSON.parse(JSON.stringify(got[ex])), { status: got[ex].status, total: sc.total, max: sc.max }, true); }
          else { delete S.recs[ex]; store(lkey(ex), null); }
        });
        if (!S.recs[S.exam]) S.recs[S.exam] = blank(S.exam);
        renderMark();
      };
      var quiet = diff.filter(function (ex) { return !edited[ex]; }), ask = diff.filter(function (ex) { return edited[ex]; });
      if (quiet.length) take(quiet);
      if (!ask.length) return rel();
      var g = got[ask[0]];
      modal('<h3>Marks already saved</h3><p>' + esc(name) + ' already has ' + (ask[0] === 'R50' ? 'Read Book' : 'Qur\u2019an') +
        ' marks saved' + (g ? ' (' + esc(g.status) + ')' : '') + '.</p><div class="acts"><button id="mc">Keep what I just marked</button>' +
        '<button class="pri" id="mo">Show the saved marks</button></div>');
      $('mc').onclick = function () { closeModal(); rel(); };
      $('mo').onclick = function () { closeModal(); if (S.pupil === name) { flushSaveDrop(name, ask); take(ask); } rel(); };
    }).catch(rel);
  }
  /* Drop unsent edits for this child (the teacher chose the saved marks instead). */
  function flushSaveDrop(name, exams) {
    Object.keys(S.pending).forEach(function (k) {
      var r = S.pending[k];
      if (r && r.pupil === name && r.cls === S.cls && exams.indexOf(r.exam) > -1) { clearTimeout(S.timers[k]); S.pending[k] = null; store(lkey(r.exam), null); }
    });
  }

  /* A boy's recent surahs from the teachers' Qur'an sheet ("Al-Naaziat 1 to 24", "Naaziat 1-9", "Abasa")
     turned into surah names, newest first. */
  S.suggest = {};
  /* One cell can hold several surahs ("Surat almasad and nasr", "Abasa - Naas", "Ayah 48 to 56 mudathir") or
     none ("Failed", "RPRP"): drop numbers and filler words, split on and / to / - / , and match each part. */
  function sheetToSurahs(t) {
    var s = String(t || '').toLowerCase().replace(/\d+/g, ' ')
      .replace(/\b(surah|surat|sura|soorah|ayahs?|ayat|ayaat|all|full|whole|rev|revision|rprp|failed|fail|from|lines?|page|pg|juz|juzz|part|homework|hw|absent|test|new)\b/g, ' ');
    var out = [];
    s.split(/\band\b|&|,|\/|\bto\b|[-\u2013+]|\bthen\b/).forEach(function (part) {
      part = part.replace(/[:().]/g, ' ').replace(/\s+/g, ' ').trim();
      if (part.length < 3) return;
      var hit = surahExact(part) || (part.length >= 4 && !isArabic(part) ? surahHits(part)[0] : '');
      if (!hit) part.split(' ').some(function (w) { return w.length >= 3 && (hit = surahExact(w)); });   // "first pages of surah houd"
      if (hit && out.indexOf(hit) < 0) out.push(hit);
    });
    return out;
  }
  window.__oeSheetToSurahs = sheetToSurahs;        // for the tests
  function suggestionsFor(name) {
    var all = S.suggest[rkey(S.school, S.side, S.cls, '')]; if (!all || !name) return [];
    var n = name.toLowerCase().replace(/\s+/g, ' ').trim(), raw = all[n];
    if (!raw) {                                       // same first name and a close surname
      var t = n.split(' ');
      Object.keys(all).some(function (k) { var u = k.split(' ');
        if (u[0] === t[0] && lev(u[u.length - 1], t[t.length - 1]) <= 2) { raw = all[k]; return true; } return false; });
    }
    var out = [];
    (raw || []).forEach(function (x) { sheetToSurahs(x).forEach(function (s) { if (out.indexOf(s) < 0) out.push(s); }); });
    return out.slice(0, 4);
  }

  function guessExam() {
    var t = (S.cls + ' ' + S.year).toLowerCase();
    return /read book|beginner|^yl|reception/.test(t) ? 'R50' : 'Q70';
  }

  function rec() { return S.recs[S.exam]; }

  function score(r) {
    var t = 0;
    if (r.exam === 'Q70') {
      r.q.tests.forEach(function (x) { if (typeof x.taj === 'number') t += x.taj; if (typeof x.hif === 'number') t += x.hif; });
      if (typeof r.q.flu === 'number') t += r.q.flu;
      return { total: t, max: 70 };
    }
    Object.keys(r.r.letters).forEach(function (k) { if (r.r.letters[k] === 1) t++; });
    if (r.r.mode === 'any') {                       // any pages: one mark per page heard
      (r.r.pages || []).forEach(function (p) { if (p && p.v === 1) t++; });
      return { total: t, max: 50 };
    }
    Object.keys(r.r.items).forEach(function (k) { if (r.r.items[k] === 1) t++; });
    return { total: t, max: 50 };
  }
  function grade(p) { return p >= 90 ? 'Excellent' : p >= 70 ? 'Very Good' : p >= 50 ? 'Good' :
    p >= 30 ? 'Satisfactory' : p >= 10 ? 'Poor' : 'Fail'; }

  function missing(r) {
    var g = [];
    if (r.exam === 'Q70') {
      r.q.tests.forEach(function (x, i) {
        if (!String(x.surah || '').trim()) g.push('Surah ' + (i + 1) + ' name');
        if (typeof x.taj !== 'number') g.push('Surah ' + (i + 1) + ' Tajweed');
        if (typeof x.hif !== 'number') g.push('Surah ' + (i + 1) + ' Hifdh');
      });
      if (typeof r.q.flu !== 'number') g.push('Fluency Reading');
    } else {
      var nl = 0, ni = 0, i;
      for (i = 0; i < LETTERS.length; i++) if (r.r.letters[i] !== 1 && r.r.letters[i] !== 0) nl++;
      if (r.r.mode === 'any') {
        var pg = pages22(r);
        pg.forEach(function (p) { if (p.v !== 1 && p.v !== 0) ni++; });
        if (nl) g.push(nl + ' letter' + (nl > 1 ? 's' : '') + ' not marked');
        if (ni) g.push(ni + ' page box' + (ni > 1 ? 'es' : '') + ' not filled');
      } else {
      for (i = 0; i < ITEMS.length; i++) if (r.r.items[i] !== 1 && r.r.items[i] !== 0) ni++;
      if (nl) g.push(nl + ' letter' + (nl > 1 ? 's' : '') + ' not marked');
      if (ni) g.push(ni + ' page item' + (ni > 1 ? 's' : '') + ' not marked');
      }
    }
    return g;
  }

  function renderMark() {
    var r = rec();
    if (!r.examiner && examiner()) r.examiner = examiner();
    showExaminer();
    var html = '<div class="who"><h1>' + esc(S.pupil) + '</h1><div class="ar" id="arName"></div></div>' +
      '<div class="exam"><button data-ex="Q70" class="' + (S.exam === 'Q70' ? 'on' : '') + '">Qur\'an /70</button>' +
      '<button data-ex="R50" class="' + (S.exam === 'R50' ? 'on' : '') + '">Read Book /50</button></div>' +
      '<div class="steps" id="jump"></div>';
    if (S.exam === 'Q70') html += markQ(r); else html += markR(r);
    view.innerHTML = html;
    $('dock').style.display = '';
    document.body.classList.add('marking');
    var key = S.pupil + '|' + S.cls + '|' + S.exam;
    if (S.stepFor !== key || !$(S.step)) {
      S.stepFor = key;
      if (S.exam === 'Q70') {
        S.step = 'sec-f';
        for (var ti = 0; ti < r.q.tests.length; ti++) {
          var tt = r.q.tests[ti];
          if (typeof tt.taj !== 'number' || typeof tt.hif !== 'number') { S.step = 'sec-t' + ti; break; }
        }
      } else {
        var allL = LETTERS.every(function (x, i) { return r.r.letters[i] === 1 || r.r.letters[i] === 0; });
        S.step = allL ? 'sec-p' : 'sec-l';                 // letters done: straight to the pages
      }
    }
    showStep(S.step, true);
    wireMark();
    refresh();
    setSaveState(r.status === 'Not started' ? '' : (S.pending[saveKey(r)] ? 'Saving...' : 'Saved'));
  }

  /* A surah name too long for its tab: drop "Al-", then step the text down to 11px. */
  function fitTabs(jb) {
    var bs = Array.prototype.slice.call(jb.querySelectorAll('[data-j]')), named = jb.querySelectorAll('.tl[data-full]');
    named.forEach(function (tl) { tl.parentNode.title = tl.getAttribute('data-full'); });
    if (!named.length || !bs.length) return;
    // Width a tab's text needs, measured from its spans (a button hides its own overflow, so it can't be asked).
    var textW = function (btn) {
      var cs = getComputedStyle(btn), w = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 2;
      Array.prototype.forEach.call(btn.children, function (s) { w += s.getBoundingClientRect().width + (parseFloat(getComputedStyle(s).marginLeft) || 0); });
      return w;
    };
    var jcs = getComputedStyle(jb), room = jb.clientWidth - parseFloat(jcs.paddingLeft) - parseFloat(jcs.paddingRight);
    // Phone tabs share the bar by content; iPad/laptop tabs are equal quarters.
    var byContent = getComputedStyle(bs[0]).flexBasis === 'auto';
    var over = function () {
      return byContent ? bs.reduce(function (s, x) { return s + textW(x); }, 0) > room
                       : Math.max.apply(null, bs.map(textW)) * bs.length > room;
    };
    if (!over()) return;
    named.forEach(function (tl) { tl.textContent = tl.getAttribute('data-full').replace(/^(Aal|Al|An|Ar|As|At|Ad|Adh|Ash|Az)-/, ''); });
    for (var px = 14; over() && px >= 11; px--) named.forEach(function (tl) { tl.style.fontSize = px + 'px'; });
  }

    function band(x, w) { var s = x < 0 ? -1 : 1; return s * (1 - 1 / (Math.abs(x) * 0.55 / w + 1)) * w; }   // rubber band
    function put(el, x, anim) {

        el.style.top = el.style.left = el.style.width = el.style.height = el.style.boxSizing = el.style.willChange = ''; });
      document.documentElement.style.overflowX = '';
    }
    view.addEventListener('touchstart', function (e) {
      var t = e.target;
      if (!document.body.classList.contains('marking') || e.touches.length !== 1 || t.closest('.quick, input, textarea, select, .sugg, .modal')) { g = null; return; }
      var list = ids(), k = list.indexOf(S.step), cur = $(S.step);
      if (k < 0 || !cur) { g = null; return; }
      g = { x: e.touches[0].clientX, y: e.touches[0].clientY, axis: null, k: k, list: list, cur: cur,
            prev: list[k - 1] ? $(list[k - 1]) : null, next: list[k + 1] ? $(list[k + 1]) : null, dx: 0, hist: [] };
    }, { passive: true });
    view.addEventListener('touchmove', function (e) {

      jb.innerHTML = jump.map(function (j) { return '<button data-j="' + j[0] + '" class="' + (j[2] ? 'ok' : '') + (j[0] === S.step ? ' on' : '') + '">' +
        '<span class="tl"' + (j[4] ? ' data-full="' + esc(j[4]) + '"' : '') + '>' + esc(j[1]) + '</span>' +
        (j[3] !== '' && j[3] != null ? '<span class="sc">' + j[3] + '</span>' : '') + '</button>'; }).join('');
      fitTabs(jb);
      jb.querySelectorAll('[data-j]').forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-j'), el = $(id);
          if (el && el.classList.contains('step')) showStep(id);
          else if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
      });
    }
  }

  /* ---------------- autosave ---------------- */
  S.pending = {}; S.inflight = {}; S.timers = {}; S.lastBook = {}; S.mine = {}; S.hold = {};

  function changed() {
    var r = rec();
    if (r.status === 'Not started') r.status = 'In progress';
    r.updated = Date.now();
    S.lastBook[rkey(r.school, r.side, r.cls, r.pupil)] = r.exam;
    (S.touchedEx = S.touchedEx || {})[r.exam] = true;
    store(lkey(r.exam), JSON.stringify({ dirty: true, rec: r }));
    noteSaved(JSON.parse(JSON.stringify(r)), null);
    refresh();
    queueSave(r.exam);
  }

  function saveKey(r) { return rkey(r.school, r.side, r.cls, r.pupil) + '|' + r.exam; }
  function isOpen(r) { return S.pupil === r.pupil && S.cls === r.cls && S.side === r.side && S.exam === r.exam; }

  function queueSave(exam, delay) {
    var r = S.recs[exam], k = saveKey(r);
    S.pending[k] = r;
    setSaveState('Saving...');
    clearTimeout(S.timers[k]);
    S.timers[k] = setTimeout(function () { sendSave(k); }, delay == null ? 900 : delay);
  }

  function flushSave() {
    Object.keys(S.pending).forEach(function (k) { if (S.pending[k]) { clearTimeout(S.timers[k]); sendSave(k); } });
  }

  function sendSave(k) {
    var r = S.pending[k];
    if (!r) return;
    if (S.hold[rkey(r.school, r.side, r.cls, r.pupil)] || S.inflight[k]) { clearTimeout(S.timers[k]); S.timers[k] = setTimeout(function () { sendSave(k); }, 500); return; }
    S.pending[k] = null;
    S.inflight[k] = true;
    var copy = JSON.parse(JSON.stringify(r));
    S.mine[copy.updated] = 1;
    var key = 'oe:rec:' + [S.home.round, copy.school, copy.side, copy.cls, copy.pupil, copy.exam].join('|').toLowerCase();
    call('saveRecord', copy).then(function (res) {
      S.inflight[k] = false;
      var live = S.recs[copy.exam];
      if (live && isOpen(copy) && res.status !== live.status && copy.status === live.status) {
        live.status = res.status; refresh();
      }
      noteSaved(copy, res, true);
      if (!S.pending[k]) {
        store(key, JSON.stringify({ dirty: false, rec: copy }));
        if (isOpen(copy)) setSaveState('Saved');
      }
    }).catch(function (err) {
      S.inflight[k] = false;
      if (!S.pending[k]) S.pending[k] = r;
      if (isOpen(copy)) setSaveState('Not saved yet - retrying', true);
      else toast(copy.pupil + ' not saved yet - retrying', 2500);
      clearTimeout(S.timers[k]);
      S.timers[k] = setTimeout(function () { sendSave(k); }, 4000);
    });
  }

  function setSaveState(t, err) { var el = $('ss'); if (!el) return; el.textContent = t; el.className = 'savestate' + (err ? ' err' : ''); }

  document.addEventListener('visibilitychange', function () { if (document.hidden) flushSave(); });
  window.addEventListener('pagehide', flushSave);

  function finish() {
    var r = rec();
    if (r.status === 'Done') { noteSaved(JSON.parse(JSON.stringify(r)), null); flushSave(); showClass(); return; }
    var g = missing(r);
    if (g.length) {
      modal('<h3>Not finished yet</h3><p>Still to mark:</p><p><b>' + esc(g.join(', ')) + '</b></p>' +
        '<p class="hint">Everything so far is saved. Come back to this pupil any time.</p><div class="acts"><button class="pri" id="mc">OK</button></div>');
      $('mc').onclick = closeModal; return;
    }
    // Done at once on this iPad; the save follows in the background and keeps retrying until it lands.
    r.status = 'Done'; r.updated = Date.now();
    store(lkey(r.exam), JSON.stringify({ dirty: true, rec: r }));
    var sc = score(r), pct = Math.round(sc.total / sc.max * 100);
    noteSaved(JSON.parse(JSON.stringify(r)), { status: 'Done', total: sc.total, max: sc.max });
    toast(S.pupil + ' finished: ' + sc.total + ' / ' + sc.max + ' (' + grade(pct) + ')', 3000);
    var k = saveKey(r);
    clearTimeout(S.timers[k]);
    S.pending[k] = r;
    sendSave(k);
    showClass();
  }

  /* ---------------- office progress ---------------- */
  function showProgress() {
    S.tab = 'prog';
    setHeader('', null);
    var h = S.home;
    var html = tabs();
    if (!h.schools.length) html += '<p class="empty">No pupils loaded yet.</p>';
    h.schools.filter(function (s) { return !MODE.school || s.name === MODE.school; }).forEach(function (s) {
      html += '<h2 class="sec">' + esc(MODE.school ? 'Classes' : showName(s.name)) + '</h2><table class="prog"><tr><th>Side</th><th>Class</th><th>Done</th><th>In progress</th><th>Not started</th></tr>';
      s.sides.forEach(function (sd) {
        sd.classes.forEach(function (c) {
          html += '<tr><td>' + esc(sd.name) + '</td><td>' + esc(clsName(c.name, s.name, sd.name)) + '</td><td class="n"><b>' + c.done + '</b> of ' + c.total +
            '</td><td class="n">' + c.started + '</td><td class="n">' + (c.total - c.done - c.started) + '</td></tr>';
        });
      });
      html += '</table>';
    });
    html += '<p style="margin-top:18px"><a class="link" href="' + esc(h.sheetUrl) + '" target="_blank" rel="noopener">Open the marks spreadsheet</a></p>' +
      '<p><button class="smallbtn" id="refresh">Refresh</button> <button class="smallbtn" id="loadp">Load pupil list</button></p>';
    view.innerHTML = html; wireTabs();
    $('refresh').onclick = function () { loading(); var sentAt = Date.now(); call('getHomeFresh').then(function (x) { S.home = overlayHome(x, sentAt); keepHome(); showProgress(); }).catch(fail); };
    $('loadp').onclick = function () {
      modal('<h3>Load pupil list</h3><p class="hint">Paste rows from a spreadsheet or CSV with a header row: School, Side, Class, Pupil, Year group, Qur\'an class. ' +
        'This replaces the list for the schools in the paste. Marks already saved are kept.</p>' +
        '<textarea id="csv" style="min-height:180px"></textarea><div class="acts"><button id="mc">Cancel</button><button class="pri" id="mo">Load</button></div>');
      $('mc').onclick = closeModal;
      $('mo').onclick = function () {
        var t = $('csv').value; if (!t.trim()) return;
        $('mo').disabled = true;
        call('loadPupils', t, MODE.school || 'Saturday School').then(function (res) {
          closeModal(); toast(res.msg, 4000);
          if (res.ok) { var sentAt = Date.now(); call('getHome').then(function (x) { S.home = overlayHome(x, sentAt); showProgress(); }); }
        }).catch(function (e) { closeModal(); toast('Failed: ' + (e && e.message || e), 5000); });
      };
    };
  }

  $('modal').onclick = function (e) { if (e.target === $('modal')) closeModal(); };
  if (IN_GOOGLE && google.script.url) {
    google.script.url.getLocation(function (loc) { applyMode(loc && loc.parameter); loadHome(); });
  } else {
    var qp = {};
    String(location.search || '').replace(/^\?/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('='); if (i > 0) qp[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    applyMode(window.OE_PARAMS || qp); loadHome();
  }
})();
</script>
<script>
  if ('serviceWorker' in navigator && !(window.google && google.script)) {
    // When a new version of the app arrives, reload once so nobody runs the old one.
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloaded) return; reloaded = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function (reg) { reg.update(); }).catch(function () {});
  }
</script>
</body>
